name: 每天自动更新校招数据
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 从飞书同步数据
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          BASE_TOKEN: ${{ secrets.BASE_TOKEN }}
          JOBS_TABLE_ID: ${{ vars.JOBS_TABLE_ID }}
          MAJORS_TABLE_ID: ${{ vars.MAJORS_TABLE_ID }}
          PLATFORMS_TABLE_ID: ${{ vars.PLATFORMS_TABLE_ID }}
          RESOURCES_TABLE_ID: ${{ vars.RESOURCES_TABLE_ID }}
        run: python export_data.py
      - name: 保存数据
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/
          git diff --staged --quiet || (git commit -m '自动更新校招数据' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
